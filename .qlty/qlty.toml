# Qlty static analysis configuration
# https://docs.qlty.sh

config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "scripts/**",
  "tests/**",
  # Semgrep rule fixtures are deliberately bad code; the rules' own `semgrep --test` fixtures are
  # not production TypeScript and must not drive complexity or duplication metrics.
  ".semgrep/**",
  # The ESLint flat config is a build-time artifact, not shipped `src/`; keep smells scoped to
  # production TypeScript modules (`AGENTS.md` → Function complexity & decomposition).
  "*.mjs"
]

test_patterns = [
  "tests/**/*.test.ts"
]

[[source]]
name = "default"
default = true

[smells.file_complexity]
# WHY: This smell reports a per-file aggregate complexity score (`High total complexity (count = N)`),
# not a line count — the two differ by roughly an order of magnitude.
# `threshold = 100` is a calibrated ceiling rather than a target: the smell reports `count >= threshold`,
# and the largest analysed module after the #280 extractions is `server-manager.ts` (90), followed by
# `connection-coordinator.ts` (86) and `auth-lock.ts` (76) — cohesive `LCOM <= 1` state machines.
# That leaves nine points of headroom before a module trips the smell (the next report is at 100),
# so a `fix:` / `feat:` PR on cohesive code never has to perform an opportunistic split just to get
# under the gate, while a module scoring 100 or more is genuine multi-concern accumulation that
# belongs in a planned `refactor:` extraction. The analysed set is `src/` only: `exclude_patterns`
# above drops `scripts/**` and `tests/**`, so `scripts/release.ts` is outside this ceiling.
# Unlike `function_complexity` and `boolean_logic`, no ESLint rule mirrors this smell and no CI job
# runs `qlty smells`, so the value is a review-time ceiling: `tests/repo-policy.test.ts` pins the
# number and the Qlty dashboard reports the score, but the PR gate will not block on it.
enabled = true
threshold = 100

# WHY: Qlty's `threshold` is the minimum offending nesting level (`level >= threshold`, default 5).
# Setting `threshold = 5` allows `<= 4` levels and flags `level >= 5`, matching ESLint's
# `"max-depth": ["error", 4]` and 5-level `MAX_CONTROL_FLOW_DEPTH_SELECTOR`.
[smells.nested_control_flow]
enabled = true
threshold = 5

# WHY: `threshold = 15` flags functions at or above 15, matching ESLint's
# `complexity: ["error", { max: 15 }]` and `pi-mcp/max-cognitive-complexity` (see AGENTS.md →
# Function complexity & decomposition). The ESLint rule is the blocking gate; this smell is the
# source of truth for the metric on the Qlty dashboard.
[smells.function_complexity]
enabled = true
threshold = 15

# WHY: `threshold = 4` is Qlty's minimum offending `&&` / `||` operator count, so `<= 3` operators
# pass and `>= 4` are reported as `Complex binary expression` (verified against this Qlty build).
# It matches ESLint's `pi-mcp/max-boolean-operators` cap of 3 (see AGENTS.md -> Architecture):
# the ESLint rule is the blocking gate, this smell keeps the Qlty dashboard on the same threshold.
[smells.boolean_logic]
enabled = true
threshold = 4

# Disable third-party linters so CI workflows (.github/workflows/ci.yml, semgrep.yml,
# secret-scan.yml, workflow-lint.yml) remain the single source of truth.
[[plugin]]
name = "eslint"
mode = "disabled"

[[plugin]]
name = "semgrep"
mode = "disabled"

[[plugin]]
name = "gitleaks"
mode = "disabled"

[[plugin]]
name = "actionlint"
mode = "disabled"

[[plugin]]
name = "trufflehog"
mode = "disabled"

[[plugin]]
name = "osv-scanner"
mode = "disabled"
