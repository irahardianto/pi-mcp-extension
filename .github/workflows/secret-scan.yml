name: Secret Scan

on:
  pull_request: # WHY: Scan commits in incoming PRs targeting any branch (no branches filter for stacked PRs)
  merge_group:
  push:
    branches: [main] # WHY: Scan commits landing on main
  schedule:
    # WHY: Weekly audit on Sunday at 00:00 UTC over full repository history
    - cron: "0 0 * * 0"
  workflow_dispatch: # WHY: Allow manual trigger of full history scan on demand

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          # WHY: Pin gitleaks binary v8.30.1 with SHA-256 verification from official release checksums
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          ARCHIVE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          BIN_DIR="${RUNNER_TEMP:-/tmp}/gitleaks-bin"
          mkdir -p "$BIN_DIR"
          curl -fsSL --retry 3 --retry-connrefused -o "${BIN_DIR}/gitleaks.tar.gz" "$ARCHIVE_URL"
          echo "${GITLEAKS_SHA256}  ${BIN_DIR}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${BIN_DIR}/gitleaks.tar.gz" -C "$BIN_DIR" gitleaks
          chmod +x "${BIN_DIR}/gitleaks"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Run gitleaks scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # WHY: Scan only the changed commits for PRs, merge_group, and pushes to keep feedback fast,
          # while scanning full history on schedule/workflow_dispatch or when commit graph context is incomplete.
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ] && \
               git rev-parse --verify --quiet "${PR_BASE_SHA}^{commit}" >/dev/null 2>&1 && \
               git rev-parse --verify --quiet "${PR_HEAD_SHA}^{commit}" >/dev/null 2>&1; then
              RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if [ -n "$MG_BASE" ] && [ -n "$MG_HEAD" ] && \
               git rev-parse --verify --quiet "${MG_BASE}^{commit}" >/dev/null 2>&1 && \
               git rev-parse --verify --quiet "${MG_HEAD}^{commit}" >/dev/null 2>&1; then
              RANGE="${MG_BASE}..${MG_HEAD}"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && \
               git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
              RANGE="${PUSH_BEFORE}..${PUSH_SHA}"
            fi
          fi

          if [ -n "$RANGE" ]; then
            echo "Scanning commit range: ${RANGE}"
            gitleaks git --redact --verbose --exit-code 1 --log-opts="${RANGE}"
          else
            echo "Scanning full git history"
            gitleaks git --redact --verbose --exit-code 1
          fi
