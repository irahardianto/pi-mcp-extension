name: Publish npm Package

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm (required for OIDC Trusted Publishing)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Determine version bump
        id: bump
        run: |
          # Get the latest commit message(s) since last published version
          # Check if there's a previous commit to compare against
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
            BODIES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%B")
          else
            LOG=$(git log -1 --pretty=format:"%s")
            BODIES=$(git log -1 --pretty=format:"%B")
          fi

          # Default to none
          BUMP="none"

          # Check for breaking change indicator in subject or commit body
          if echo "$LOG" | grep -qE "^[a-z]+(\(.+\))?!:" || echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE:"; then
            BUMP="major"
          # Check for feature commits
          elif echo "$LOG" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          # Check for fix or perf commits
          elif echo "$LOG" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP="patch"
          fi

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Detected bump level: ${BUMP}"

      - name: Bump version
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          # Bump the version in package.json (no commit, no tag yet)
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version ${{ steps.bump.outputs.bump }} --no-git-tag-version --allow-same-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          if [ -f CHANGELOG.md ]; then
            sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${NEW_VERSION}] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          fi
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD_VERSION} → ${NEW_VERSION}"

      - name: Publish to npm
        if: steps.bump.outputs.bump != 'none'
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE}@${VERSION}" version &>/dev/null; then
            echo "Version ${VERSION} already published — skipping."
            echo "publish=false" >> "$GITHUB_ENV"
          else
            npm publish --access public --provenance
            echo "Published ${PACKAGE}@${VERSION}"
            echo "publish=true" >> "$GITHUB_ENV"
          fi

      - name: Commit version bump and tag
        if: steps.bump.outputs.bump != 'none' && env.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push
          git push --tags
