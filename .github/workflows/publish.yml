name: Publish npm Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run (rehearsal only; no commit, tag, push, or pull request)"
        type: boolean
        default: true

# Deny all permissions at the workflow level; jobs request only what they need.
permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  verify:
    name: verify
    # WHY: Release gate mirroring ci.yml to ensure every release is fully verified
    # against both supported Node versions before minting tokens or publishing.
    # Keep this job in sync with the check job in ci.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read # WHY: read repository contents to run checks
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # WHY: do not use cache: npm here. Avoid cache poisoning in a release workflow.

      - run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        # WHY: checks registry signatures and provenance attestations of every installed package.
        run: npm audit signatures

      - name: Audit production dependencies
        # WHY: same gate as ci.yml; only runtime dependencies reach users.
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Test
        if: matrix.node-version != 22
        run: npm test

      - name: Tarball sanity check
        run: npm pack --dry-run

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # WHY: push the release branch and tag, and merge the release PR
      id-token: write # WHY: mint Sigstore provenance attestations for npm OIDC Trusted Publishing
      pull-requests: write # WHY: open, retitle and squash-merge the release PR (required status checks on main block direct pushes)
      actions: write # WHY: dispatch the required workflows onto the release branch (a GITHUB_TOKEN PR triggers no pull_request workflows)
    # WHY: the release PR waits for the dispatched required workflows (CI matrix plus
    # OS tests), which take longer than the checks the job runs itself.
    timeout-minutes: 30
    env:
      # DRY_RUN is true only when manually dispatched with dry_run=true.
      # Push events or dispatch with dry_run=false evaluate to false.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Validate dispatch target
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            echo "::error::Manual release dispatch with dry_run=false is only allowed on refs/heads/main (got ${EVENT_REF})"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # WHY: Node 24 LTS bundles npm >= 11.6.1, covering the npm >= 11.5.1 needed for Trusted Publishing
          # without an unpinned global npm install (satisfies OpenSSF Scorecard Pinned-Dependencies check).
          # The verify job already tests Node 24.
          # WHY: do not use cache: npm here. Avoid cache poisoning in a release workflow.

      - name: Verify npm version supports OIDC Trusted Publishing
        run: |
          # WHY: OIDC Trusted Publishing requires npm >= 11.5.1 (see https://docs.npmjs.com/trusted-publishers/).
          # Node 24 bundles npm >= 11.6.1; this step fails closed if the runner's bundled npm is insufficient.
          MIN_NPM_VERSION="11.5.1"
          ACTUAL_NPM_VERSION=$(npm --version)
          # Dependency-free semver compare that fails before any mutating step.
          if ! node -e '
            const [actual, min] = [process.argv[1], process.argv[2]];
            const parse = (v) => {
              const [core, ...pre] = (v || "").trim().replace(/^v/, "").split("-");
              const [maj = 0, min = 0, pat = 0] = core.split(".").map(Number);
              return { maj, min, pat, pre: pre.join("-") };
            };
            const a = parse(actual);
            const m = parse(min);
            const cmp = (a.maj - m.maj) || (a.min - m.min) || (a.pat - m.pat);
            if (cmp < 0 || (cmp === 0 && a.pre && !m.pre)) {
              process.exit(1);
            }
          ' "$ACTUAL_NPM_VERSION" "$MIN_NPM_VERSION"; then
            echo "::error::Bundled npm version ${ACTUAL_NPM_VERSION} does not meet the minimum required version ${MIN_NPM_VERSION} for npm OIDC Trusted Publishing (see https://docs.npmjs.com/trusted-publishers/)."
            exit 1
          fi
          echo "Verified npm version: ${ACTUAL_NPM_VERSION} (meets minimum ${MIN_NPM_VERSION} for OIDC Trusted Publishing)"

      - name: Release
        # WHY: the release commit and its tag land on main *before* the package is
        # published — through a pull request, because the required status checks on
        # main block direct pushes for everyone — so a concurrent merge into main can
        # never leave npm holding a version that main does not know about (issue #82).
        # The script retries a rejected merge on the latest main and repairs an
        # npm/git divergence left by an earlier run.
        # WHY: the script runs on Node's built-in type stripping, so the release job never
        # installs dependencies (no `npm ci` with a write token).
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: node scripts/release.ts
