name: CI

on:
  push:
    branches: [main]
  # WHY: no `branches:` filter. Stacked PRs (AGENTS.md -> Commits & release) target another
  # PR's branch, not `main`, and must be checked before they land on `main` one by one.
  pull_request:
  merge_group:
  workflow_dispatch:

# Least privilege for every job: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel runs on `main` so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WHY: required for the Qlty coverage upload to authenticate over OIDC (no token secret)
    timeout-minutes: 15
    strategy:
      # Let every Node version finish so a failure shows whether it's version-specific.
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        # Checks registry signatures and provenance attestations of every installed package.
        run: npm audit signatures

      - name: Audit production dependencies
        # WHY: Node 22 leg only to avoid redundant checks across matrix runs.
        # WHY: --omit=dev audits only runtime/production dependencies that ship to users.
        # Dev dependencies are covered separately by Dependabot alerts and dependency review.
        # Note: npm audit --omit=dev still inspects installed peerDependencies (required for tests).
        if: matrix.node-version == 22
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Upload coverage to Qlty
        # WHY: Run only on the Node 22 leg where test:coverage generates lcov.info,
        # and skip on fork PRs where GitHub provides no OIDC token.
        if: matrix.node-version == 22 && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: lcov.info
          format: lcov
          # WHY: harmless when the reporter writes repository-relative paths; strips the
          # runner workspace if it ever writes absolute ones, which Qlty would reject.
          strip-prefix: ${{ github.workspace }}
          skip-errors: true

      - name: Test
        if: matrix.node-version != 22
        run: npm test

      - name: Tarball sanity check
        run: npm pack --dry-run

  test-os:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

