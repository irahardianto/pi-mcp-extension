name: dependency-review

on:
  # WHY: no `branches:` filter. Stacked PRs target another PR's branch,
  # not `main`, and must be checked before merging into their base.
  pull_request:
  merge_group:
  # WHY: publish.yml dispatches this workflow onto the release branch: a PR created
  # with GITHUB_TOKEN triggers no pull_request workflows, so the release PR gets its
  # `dependency-review` check run this way instead.
  workflow_dispatch:

# Least privilege: dependency review API comparison requires only repository read permissions.
# WHY: Avoid comment-summary-in-pr which requires pull-requests: write; the action automatically
# outputs a comprehensive summary to the GitHub Actions Job Summary without elevated permissions.
permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # WHY: resolve the release PR's base/head SHAs when dispatched by publish.yml
    steps:
      - name: Resolve comparison refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # WHY: dispatched runs carry no pull_request payload; resolve the open PR
            # for the branch and use its base/head SHAs.
            BASE_REF="$(gh pr list --head "$HEAD_REF" --state open --json baseRefOid --jq '.[0].baseRefOid // empty')"
            HEAD_REF_SHA="$(gh pr list --head "$HEAD_REF" --state open --json headRefOid --jq '.[0].headRefOid // empty')"
            if [ -z "$BASE_REF" ] || [ -z "$HEAD_REF_SHA" ]; then
              printf '::error::No open pull request for branch %s to review dependencies for.\n' "$HEAD_REF"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # WHY: merge queue stages the PR onto the current main; compare the staged
            # merge commit's base/head SHAs provided by the merge_group payload.
            BASE_REF="$MG_BASE"
            HEAD_REF_SHA="$MG_HEAD"
          else
            BASE_REF="$PR_BASE"
            HEAD_REF_SHA="$PR_HEAD"
          fi
          printf 'base=%s\nhead=%s\n' "$BASE_REF" "$HEAD_REF_SHA" >> "$GITHUB_OUTPUT"

      # WHY: actions/checkout is intentionally omitted. actions/dependency-review-action v5.0.0
      # compares dependency manifests using GitHub's Dependency Review API. Local workspace
      # files are not read when configuration is inline; the comparison refs come from the
      # resolve step (the PR event payload on pull_request, the merge_group payload in a
      # merge queue, or the release PR on workflow_dispatch).
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.refs.outputs.base }}
          head-ref: ${{ steps.refs.outputs.head }}
          fail-on-severity: high
          # WHY: fail-on-scopes filters both vulnerability and license checks to runtime dependencies.
          # Dev dependencies are vetted through Dependabot alerts and CI checks without blocking PRs.
          fail-on-scopes: runtime
          # WHY: Deny strong copyleft and source-available licenses for runtime code to prevent
          # licensing contagion in consuming applications while permitting standard permissive licenses
          # (MIT, Apache-2.0, BSD, ISC, BlueOak-1.0.0, 0BSD, Unlicense).
          # NOTE: deny-licenses is deprecated upstream for removal in v6 (actions/dependency-review-action#938)
          # and must be migrated to allow-licenses (current runtime set: MIT, Apache-2.0, BSD-2-Clause,
          # BSD-3-Clause, ISC, 0BSD, Unlicense, BlueOak-1.0.0) when bumping to v6.
          deny-licenses: >-
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            SSPL-1.0
