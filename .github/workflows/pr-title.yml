name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  # WHY: publish.yml dispatches this workflow onto the release branch: a PR created
  # with GITHUB_TOKEN triggers no pull_request workflows, so the release PR gets its
  # `pr-title` check run this way instead.
  workflow_dispatch:

permissions:
  contents: read # WHY: default workflow-level read access

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # WHY: read repo metadata
      pull-requests: read # WHY: gh api inspects changed files to verify CHANGELOG.md, and resolves the PR when dispatched
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # WHY: merge queue re-runs this check on the staged merge, where no single PR
            # title applies; title validation already happened on the PR. No-op success.
            printf 'number=0\ntitle=\nbody<<PR_BODY_EOF\n\nPR_BODY_EOF\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # WHY: dispatched runs carry no pull_request payload; resolve the open PR
            # for the branch instead.
            PR_NUMBER_EVENT="$(gh pr list --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER_EVENT" ]; then
              printf '::error::No open pull request for branch %s to validate.\n' "$HEAD_REF"
              exit 1
            fi
          fi
          TITLE="$(gh pr view "$PR_NUMBER_EVENT" --json title --jq .title)"
          BODY="$(gh pr view "$PR_NUMBER_EVENT" --json body --jq '.body // ""')"
          {
            printf 'number=%s\n' "$PR_NUMBER_EVENT"
            printf 'title=%s\n' "$TITLE"
            printf 'body<<PR_BODY_EOF\n%s\nPR_BODY_EOF\n' "$BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Validate PR title and changelog entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.pr.outputs.title }}
          BODY: ${{ steps.pr.outputs.body }}
        run: |
          set -euo pipefail

          if [ "${PR_NUMBER:-0}" = "0" ]; then
            # WHY: merge_group no-op (see resolve step); nothing to validate.
            printf '::notice::merge_group context: skipping PR title validation.\n'
            exit 0
          fi

          CR=$'\r'
          LF=$'\n'

          # Escape untrusted data before interpolation into GitHub Actions workflow commands
          # to prevent command-injection / formatting alteration.
          escape_data() {
            local data="${1:-}"
            data="${data//%/%25}"
            data="${data//$CR/%0D}"
            data="${data//$LF/%0A}"
            printf '%s' "$data"
          }

          # Conventional Commit regex per AGENTS.md and stack spec:
          # Types: feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert
          # Scope: optional, enclosed in parentheses with [a-z0-9,./-]+
          # Breaking marker: optional '!'
          # Description: starts with a non-space character ([^ ].*$)
          re='^(feat|fix|perf|refactor|docs|test|chore|ci|build|style|revert)(\([a-z0-9,./-]+\))?(!?): [^ ].*$'

          if [[ ! "$TITLE" =~ $re ]]; then
            ESCAPED_TITLE="$(escape_data "$TITLE")"
            printf "::error::PR title '%s' does not follow Conventional Commits format (e.g. 'feat: description', 'fix(scope): description', or 'feat!: description'). See AGENTS.md → Commits & release for rules.\n" "$ESCAPED_TITLE"
            exit 1
          fi

          TYPE="${BASH_REMATCH[1]}"
          BREAKING="${BASH_REMATCH[3]}"

          # Check if the PR body contains a BREAKING CHANGE indicator.
          # In this repo, squash merges use PR_BODY as commit body, and publish.yml checks:
          # echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE:"
          # We use a here-string without pipeline to avoid SIGPIPE/pipefail false negatives on large bodies,
          # and strip carriage returns ($CR) to handle CRLF line endings from the GitHub web UI.
          BODY_HAS_BREAKING=false
          if grep -Eq '^BREAKING[ -]CHANGE:' <<<"${BODY//$CR/}"; then
            BODY_HAS_BREAKING=true
          fi

          # Classify release bump level to mirror .github/workflows/publish.yml:
          # - Breaking change ('!' marker or body BREAKING CHANGE): major release
          # - feat: minor release
          # - fix or perf: patch release
          # - all others (refactor, docs, test, chore, ci, build, style, revert): no release
          if [[ -n "$BREAKING" || "$BODY_HAS_BREAKING" == "true" ]]; then
            BUMP="major"
          elif [[ "$TYPE" == "feat" ]]; then
            BUMP="minor"
          elif [[ "$TYPE" == "fix" || "$TYPE" == "perf" ]]; then
            BUMP="patch"
          else
            BUMP="none"
          fi

          printf '::notice::PR title will trigger release: %s\n' "$BUMP"

          # If the body contains a breaking change line but the title has no '!', fail:
          # the squash commit would trigger a major release while the title misrepresents it.
          if [[ "$BODY_HAS_BREAKING" == "true" && -z "$BREAKING" ]]; then
            ESCAPED_TITLE="$(escape_data "$TITLE")"
            printf "::error::PR body contains a 'BREAKING CHANGE:' or 'BREAKING-CHANGE:' line which would trigger a major release per publish.yml, but PR title '%s' lacks the '!' breaking marker. Either add '!' to the title (e.g. '%s!:' or '%s(scope)!:') and update CHANGELOG.md, or reword the line in the PR description if no breaking change is intended (see AGENTS.md → Commits & release).\n" "$ESCAPED_TITLE" "$TYPE" "$TYPE"
            exit 1
          fi

          # Releases (major, minor, patch) require a user-facing entry in CHANGELOG.md under ## [Unreleased]
          if [[ "$BUMP" != "none" ]]; then
            # Query pull request files via the paginated REST API instead of `gh pr diff`
            # to avoid HTTP 406 diff limits on large PRs (>300 files / >20k lines).
            CHANGED_FILES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
            if ! grep -Fxq 'CHANGELOG.md' <<<"$CHANGED_FILES"; then
              printf "::error::PR triggers a '%s' release (%s%s), but CHANGELOG.md is not among the changed files. Please add an entry under '## [Unreleased]' in CHANGELOG.md (see AGENTS.md → Commits & release).\n" "$BUMP" "$TYPE" "${BREAKING:+!}"
              exit 1
            fi
          fi
