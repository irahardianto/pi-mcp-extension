name: Scorecard

on:
  # WHY: Runs when branch protection rules change so Scorecard's Branch-Protection check reflects them immediately.
  branch_protection_rule:
  # WHY: Weekly refresh keeps the Maintained and supply-chain checks up to date on scorecard.dev.
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [main]
  # WHY: Allows maintainers to run a manual scan on demand without waiting for the weekly schedule.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WHY: Disallow all permissions at the workflow level; widen only per job.
# The starter template used `permissions: read-all`, but zizmor flags that as overly broad.
# Upstream scorecard-action v2.5.0 uses `permissions: {}` as its recommended default.
permissions: {}

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # WHY: Required to upload SARIF results to GitHub Code Scanning.
      security-events: write # Upload SARIF to GitHub code scanning
      # WHY: Required for GitHub OIDC token generation to sign and publish results to api.scorecard.dev.
      id-token: write # Sign results published to api.scorecard.dev via GitHub OIDC
      # WHY: Required to checkout code and analyze repository contents.
      contents: read # Read repo contents

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # WHY: Publishing replaces weekly batch scans with repo-generated signed results, enabling the badge and public API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
