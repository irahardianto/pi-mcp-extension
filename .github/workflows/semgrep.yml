name: Semgrep

on:
  push:
    branches: [main]
  # WHY: no `branches:` filter. Stacked PRs (AGENTS.md -> Commits & release) target another
  # PR's branch, not `main`, and must be checked before they land on `main` one by one.
  pull_request:
  merge_group:
  schedule:
    # Weekly Sunday midnight scan for newly published rules / vulnerability disclosures.
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Least privilege: workflow defaults to read-only repository access.
permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel runs on `main` so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # WHY: Required to upload SARIF results to GitHub code scanning

    container:
      # WHY: Pin container by SHA256 digest for supply-chain security (Semgrep 1.181.0).
      image: semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test custom Semgrep rules
        run: semgrep --test --metrics=off .semgrep/

      - name: Run Semgrep SAST scan
        id: semgrep
        run: semgrep scan --metrics=off --config p/typescript --config p/javascript --config p/github-actions --config .semgrep/ --error --sarif --output semgrep.sarif

      - name: Drop suppressed findings from SARIF
        id: filter_sarif
        # WHY: GitHub Code Scanning ignores SARIF `suppressions` and turns in-source-suppressed
        # findings into open alerts. We filter them out before upload so in-source `nosemgrep` + WHY
        # is the single source of truth.
        # Run even if real findings failed the scan step (if: always()), but skip if scan was skipped.
        if: always() && steps.semgrep.outcome != 'skipped'
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys

          sarif_file = "semgrep.sarif"
          if not os.path.isfile(sarif_file):
              sys.exit(f"Error: SARIF file not found: {sarif_file}")

          with open(sarif_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict) or "runs" not in data or not isinstance(data["runs"], list):
              sys.exit("Error: Invalid SARIF: root must be an object with a 'runs' list")

          total_findings = 0
          dropped_findings = 0

          for run in data["runs"]:
              if not isinstance(run, dict):
                  sys.exit("Error: Invalid SARIF: run element must be an object")
              results = run.get("results")
              if results is None:
                  results = []
              elif not isinstance(results, list):
                  sys.exit("Error: Invalid SARIF: results must be a list")
              kept = []
              for res in results:
                  if not isinstance(res, dict):
                      sys.exit("Error: Invalid SARIF: result element must be an object")
                  total_findings += 1
                  if res.get("suppressions"):
                      dropped_findings += 1
                  else:
                      kept.append(res)
              run["results"] = kept

          tmp_file = sarif_file + ".tmp"
          with open(tmp_file, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          os.replace(tmp_file, sarif_file)

          remaining = total_findings - dropped_findings
          print(f"SARIF filter: dropped {dropped_findings} suppressed finding(s), {remaining} remaining (total: {total_findings})")
          EOF

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        # WHY: Run even if real findings fail the scan step (if: always()), but require the filter step to succeed,
        # and skip on fork PRs where GITHUB_TOKEN lacks security-events: write.
        if: always() && steps.filter_sarif.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: semgrep.sarif
          category: semgrep
