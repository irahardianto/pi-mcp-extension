rules:
  # AGENTS.md Security & OAuth: "Never substring-match "401" in error messages."
  - id: pi-mcp.no-401-substring
    languages: [typescript]
    severity: ERROR
    message: >-
      Trigger OAuth only on a genuine HTTP 401 (status / UnauthorizedError), never by
      substring-matching "401" in a message (AGENTS.md -> Security & OAuth).
    pattern-either:
      - pattern: $X.includes("401")
      - pattern: $X.indexOf("401")
      - pattern: $X.match("401")
      - pattern: $X.search("401")
      - patterns:
          - pattern-either:
              - pattern: new RegExp($PATTERN, ...)
              - pattern: RegExp($PATTERN, ...)
          - metavariable-regex:
              metavariable: $PATTERN
              regex: ".*401.*"
      # WHY: match the regex literal itself rather than `/<re>/.test(` / `/<re>/.exec(` so a `401`
      # pattern is caught wherever it lives: inline, inside an array constant, or bound to a
      # variable before `.some(...)` / `.test(...)` is called on it. Matching only the literal
      # keeps ordinary strings (`"docs/http/401/handling.md"`) out of the findings.
      - patterns:
          - pattern: $REGEX_LITERAL
          - metavariable-regex:
              metavariable: $REGEX_LITERAL
              regex: '^/(?:[^/\n\\]|\\.)*401(?:[^/\n\\]|\\.)*/[dgimsuvy]*$'
