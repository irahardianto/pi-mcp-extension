<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131B2E" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.2" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0.82" cy="0.55" r="0.48">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="bridgeLine" x1="39" y1="25" x2="58" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background & grid -->
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#glowLeft)" />
  <rect width="1280" height="640" fill="url(#glowRight)" />

  <!-- Outer frame -->
  <rect x="24" y="24" width="1232" height="592" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Left Column: Identity & Pitch -->
  <g transform="translate(88, 104)">
    <!-- Brand Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#iconBg)" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2.2" />
      <path d="M39 38H54" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
      <path d="M39 25V45.5C39 50.7 43.3 55 48.5 55H54" stroke="url(#bridgeLine)" stroke-width="5.5" stroke-linecap="round" />
      <path d="M25 25V49C25 52 23.2 54.4 20.2 55.6" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" />
      <path d="M16 25H49" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="58.5" cy="38" r="4.8" fill="#0F172A" stroke="#38BDF8" stroke-width="3.4" />
      <circle cx="58.5" cy="55" r="4.8" fill="#0F172A" stroke="#34D399" stroke-width="3.4" />
    </g>

    <!-- Package Name -->
    <text x="98" y="48" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="44" font-weight="700" letter-spacing="-0.5">pi-mcp-extension</text>
    <text x="100" y="76" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5">MODEL CONTEXT PROTOCOL CLIENT FOR PI</text>

    <!-- Headline -->
    <text x="0" y="152" fill="#F1F5F9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700">Connect the Pi coding agent</text>
    <text x="0" y="196" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600">to any MCP server out of the box.</text>

    <!-- Feature Pills Row 1 -->
    <g transform="translate(0, 236)">
      <rect x="0" y="0" width="218" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="22" cy="20" r="5" fill="#38BDF8" />
      <text x="38" y="25" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">stdio · HTTP · SSE</text>

      <rect x="232" y="0" width="252" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="254" cy="20" r="5" fill="#34D399" />
      <text x="270" y="25" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">OAuth 2.1 (PKCE + DCR)</text>
    </g>

    <!-- Feature Pills Row 2 -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="248" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="22" cy="20" r="5" fill="#818CF8" />
      <text x="38" y="25" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Auto-Discovery &amp; Retry</text>

      <rect x="262" y="0" width="244" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="284" cy="20" r="5" fill="#FBBF24" />
      <text x="300" y="25" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Trusted Project Config</text>
    </g>

    <!-- Terminal Install Command Box -->
    <g transform="translate(0, 366)">
      <rect x="0" y="0" width="506" height="62" rx="12" fill="#090D16" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" />
      <text x="24" y="38" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="700">$</text>
      <text x="48" y="38" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="500">pi install npm:pi-mcp-extension</text>
    </g>
  </g>

  <!-- Right Column: Visual Architecture Diagram Card -->
  <g transform="translate(684, 96)">
    <rect x="0" y="0" width="508" height="448" rx="18" fill="#0B1120" fill-opacity="0.88" stroke="#1E293B" stroke-width="2" />

    <!-- Top Node: Pi Coding Agent -->
    <g transform="translate(36, 36)">
      <rect x="0" y="0" width="436" height="78" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
      <text x="218" y="34" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Pi Coding Agent (TUI / RPC)</text>
      <text x="218" y="58" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/mcp · :start · :stop · :auth · mcp_status · mcp_connect</text>
    </g>

    <!-- Connector 1 -->
    <path d="M254 114V162" stroke="#38BDF8" stroke-width="3" stroke-dasharray="5 4" />
    <circle cx="254" cy="138" r="4" fill="#38BDF8" />

    <!-- Middle Node: pi-mcp-extension Bridge -->
    <g transform="translate(36, 162)">
      <rect x="0" y="0" width="436" height="96" rx="12" fill="#172554" fill-opacity="0.55" stroke="#818CF8" stroke-width="2" />
      <text x="218" y="34" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">pi-mcp-extension</text>
      <text x="218" y="58" text-anchor="middle" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Coordinator · ServerManager · ToolBridge (TypeBox)</text>
      <text x="218" y="80" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">OAuth 2.1 + PKCE · Tree PID Supervision · JSONC</text>
    </g>

    <!-- Connectors to MCP Servers -->
    <path d="M104 258V312" stroke="#34D399" stroke-width="2.5" />
    <path d="M254 258V312" stroke="#34D399" stroke-width="2.5" />
    <path d="M404 258V312" stroke="#34D399" stroke-width="2.5" />

    <!-- Bottom Server Nodes -->
    <g transform="translate(36, 312)">
      <rect x="0" y="0" width="136" height="92" rx="10" fill="#0F172A" stroke="#34D399" stroke-opacity="0.7" stroke-width="1.8" />
      <text x="68" y="34" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">HTTP + OAuth</text>
      <text x="68" y="56" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Supabase</text>
      <text x="68" y="74" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">DeepSource</text>

      <rect x="150" y="0" width="136" height="92" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.8" />
      <text x="218" y="34" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">stdio</text>
      <text x="218" y="56" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Playwright</text>
      <text x="218" y="74" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Context7 · FS</text>

      <rect x="300" y="0" width="136" height="92" rx="10" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.7" stroke-width="1.8" />
      <text x="368" y="34" text-anchor="middle" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">HTTP / SSE</text>
      <text x="368" y="56" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Custom APIs</text>
      <text x="368" y="74" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="13">Internal Tools</text>
    </g>
  </g>
</svg>
